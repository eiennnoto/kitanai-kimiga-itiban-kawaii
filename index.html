<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像ビューア</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#img{
    width:100vw;
    height:100vh;
    object-fit:contain;
}
</style>
</head>

<body>

<img id="img">

<script>
const folder = "1";
const max = 173;

let current = 1;

const img = document.getElementById("img");
const images = [];

// 全画像を先読み
for(let i=1;i<=max;i++){
    const image = new Image();
    image.src = `${folder}/_${String(i).padStart(4,"0")}.jpg`;
    images.push(image);
}

function updateImage(){
    img.src = images[current-1].src;
}

updateImage();

document.addEventListener("click",()=>{
    if(current < max){
        current++;
        updateImage();
    }
});

// 右クリックで戻る
document.addEventListener("contextmenu",(e)=>{
    e.preventDefault();

    if(current > 1){
        current--;
        updateImage();
    }
});
</script>

</body>
</html>
